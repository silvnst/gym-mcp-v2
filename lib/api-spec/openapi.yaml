openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Gym Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: plans
    description: Workout plan operations
  - name: sessions
    description: Workout session operations
  - name: sets
    description: Set operations
  - name: insights
    description: Training analysis
  - name: garmin
    description: Garmin Connect data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Rename the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanWithExercises"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a plan with exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanBody"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanWithExercises"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get plan detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanWithExercises"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanWithExercises"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions (newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session metadata (name, date, notes, duration)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/exercises:
    post:
      operationId: addSessionExercise
      tags: [sessions]
      summary: Add an exercise to an existing session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionExerciseBody"
      responses:
        "201":
          description: Created session exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExerciseWithSets"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/exercises/{exerciseId}:
    patch:
      operationId: updateSessionExercise
      tags: [sessions]
      summary: Update an exercise within a session (rename, reorder)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionExerciseBody"
      responses:
        "200":
          description: Updated session exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExerciseWithSets"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSessionExercise
      tags: [sessions]
      summary: Delete an exercise (and its sets) from a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/sets:
    post:
      operationId: addSet
      tags: [sessions]
      summary: Add a set to a session exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetBody"
      responses:
        "201":
          description: Created set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/top:
    get:
      operationId: getTopExercises
      tags: [sessions]
      summary: Get top exercises by session count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Top exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopExercise"

  /progress/{exerciseName}:
    get:
      operationId: getExerciseProgress
      tags: [sessions]
      summary: Get progress data for an exercise
      parameters:
        - name: exerciseName
          in: path
          required: true
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            enum: [maxWeight, totalVolume, e1rm]
            default: maxWeight
      responses:
        "200":
          description: Progress data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressDataPoint"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /insights/bests:
    get:
      operationId: getBests
      tags: [insights]
      summary: Best set per frequently trained exercise, ranked by session count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Best sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BestSet"

  /insights/muscle-sets:
    get:
      operationId: getMuscleSets
      tags: [insights]
      summary: Logged sets per muscle group and push/pull balance over the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Sets per muscle group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuscleSets"

  /trash:
    get:
      operationId: listTrash
      tags: [trash]
      summary: Deleted plans and workouts that can still be restored, newest first
      responses:
        "200":
          description: Items in the trash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrashItem"

  /trash/{id}/restore:
    post:
      operationId: restoreTrashItem
      tags: [trash]
      summary: Restore a deleted plan or workout with everything it contained
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: What was restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoredItem"
        "404":
          description: Not in the trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /garmin/status:
    get:
      operationId: getGarminStatus
      tags: [garmin]
      summary: Whether Garmin is connected to this profile and how the last sync went
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminStatus"

  /garmin/sync:
    post:
      operationId: syncGarmin
      tags: [garmin]
      summary: Pull the latest data from Garmin now
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: How many days back to sync (default 4, or 90 the first time)
      responses:
        "200":
          description: Sync status after the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminStatus"
        "404":
          description: Garmin is not connected to this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /garmin/readiness:
    get:
      operationId: getReadiness
      tags: [garmin]
      summary: Recovery check from last night's sleep, HRV and resting heart rate
      responses:
        "200":
          description: Readiness, or available false without Garmin data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /garmin/activities:
    get:
      operationId: listGarminActivities
      tags: [garmin]
      summary: Activities recorded on the watch in the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 14
      responses:
        "200":
          description: Activities, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarminActivity"

  /sets/{id}:
    put:
      operationId: updateSet
      tags: [sets]
      summary: Update a set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSetBody"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSet
      tags: [sets]
      summary: Delete a set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    TrashItem:
      type: object
      properties:
        id:
          type: string
          description: Id of the deleted plan or workout
        kind:
          type: string
          enum: [session, plan]
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the item is removed for good
      required:
        - id
        - kind
        - name
        - deletedAt
        - expiresAt

    RestoredItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [session, plan]
        name:
          type: string
      required:
        - id
        - kind
        - name

    UserRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - createdAt

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    PlanExerciseRecord:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        targetSets:
          type: integer
        targetReps:
          type: integer
        targetWeightKg:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        supersetGroup:
          type: string
          nullable: true
          description: Exercises sharing a group letter are done as a superset
        equipment:
          $ref: "#/components/schemas/Equipment"
      required:
        - id
        - planId
        - name
        - sortOrder
        - targetSets
        - targetReps

    PlanWithExercises:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PlanExerciseRecord"
      required:
        - id
        - name
        - createdAt
        - exercises

    CreatePlanExerciseBody:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer
        targetSets:
          type: integer
        targetReps:
          type: integer
        targetWeightKg:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        supersetGroup:
          type: string
          nullable: true
          description: Exercises sharing a group letter are done as a superset
        equipment:
          $ref: "#/components/schemas/Equipment"
      required:
        - name
        - sortOrder
        - targetSets
        - targetReps

    CreatePlanBody:
      type: object
      properties:
        name:
          type: string
        notes:
          type: string
          nullable: true
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/CreatePlanExerciseBody"
      required:
        - name
        - exercises

    SetRecord:
      type: object
      properties:
        id:
          type: string
        sessionExerciseId:
          type: string
        setNumber:
          type: integer
        reps:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
        effort:
          $ref: "#/components/schemas/Effort"
        lastReps:
          type: integer
          nullable: true
        lastWeightKg:
          type: number
          nullable: true
      required:
        - id
        - sessionExerciseId
        - setNumber

    SessionExerciseWithSets:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        planExerciseId:
          type: string
          nullable: true
        name:
          type: string
        sortOrder:
          type: integer
        targetSets:
          type: integer
          nullable: true
        targetReps:
          type: integer
          nullable: true
        targetWeightKg:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        supersetGroup:
          type: string
          nullable: true
          description: Exercises sharing a group letter are done as a superset
        equipment:
          $ref: "#/components/schemas/Equipment"
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SetRecord"
      required:
        - id
        - sessionId
        - name
        - sortOrder
        - sets

    SessionSummary:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
          nullable: true
        date:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        durationMin:
          type: integer
          nullable: true
        createdAt:
          type: string
        exerciseCount:
          type: integer
        setCount:
          type: integer
        totalVolumeKg:
          type: number
      required:
        - id
        - date
        - name
        - createdAt
        - exerciseCount
        - setCount
        - totalVolumeKg

    SessionWithDetail:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
          nullable: true
        date:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        durationMin:
          type: integer
          nullable: true
        createdAt:
          type: string
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/SessionExerciseWithSets"
      required:
        - id
        - date
        - name
        - createdAt
        - exercises

    CreateSessionExerciseBody:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer
        targetSets:
          type: integer
          nullable: true
        targetReps:
          type: integer
          nullable: true
        targetWeightKg:
          type: number
          nullable: true
        planExerciseId:
          type: string
          nullable: true
        supersetGroup:
          type: string
          nullable: true
          description: Exercises sharing a group letter are done as a superset
        equipment:
          $ref: "#/components/schemas/Equipment"
      required:
        - name
        - sortOrder

    CreateSessionBody:
      type: object
      properties:
        planId:
          type: string
          nullable: true
        date:
          type: string
        name:
          type: string
        notes:
          type: string
          nullable: true
        durationMin:
          type: integer
          nullable: true
        exercises:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CreateSessionExerciseBody"
      required:
        - date
        - name

    CreateSetBody:
      type: object
      properties:
        sessionExerciseId:
          type: string
        setNumber:
          type: integer
        reps:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
      required:
        - sessionExerciseId
        - setNumber

    TopExercise:
      type: object
      properties:
        name:
          type: string
        sessionCount:
          type: integer
      required:
        - name
        - sessionCount

    ProgressDataPoint:
      type: object
      properties:
        date:
          type: string
        value:
          type: number
      required:
        - date
        - value

    UpdateSessionBody:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
        notes:
          type: string
          nullable: true
        durationMin:
          type: integer
          nullable: true

    UpdateSessionExerciseBody:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer

    UpdateSetBody:
      type: object
      properties:
        reps:
          type: integer
          nullable: true
        weightKg:
          type: number
          nullable: true
        setNumber:
          type: integer
          nullable: true
        effort:
          $ref: "#/components/schemas/Effort"

    Equipment:
      type: string
      nullable: true
      enum: [barbell, dumbbell, bodyweight, machine, cable, other, null]

    Effort:
      type: string
      nullable: true
      description: How the set felt
      enum: [easy, right, hard, null]

    BestSet:
      type: object
      properties:
        name:
          type: string
        sessionCount:
          type: integer
        weightKg:
          type: number
        reps:
          type: integer
        e1rm:
          type: number
        date:
          type: string
      required: [name, sessionCount, weightKg, reps, e1rm, date]

    MuscleSetCount:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        sets:
          type: integer
      required: [key, label, sets]

    MuscleSets:
      type: object
      properties:
        days:
          type: integer
        muscles:
          type: array
          items:
            $ref: "#/components/schemas/MuscleSetCount"
        push:
          type: integer
        pull:
          type: integer
      required: [days, muscles, push, pull]

    GarminStatus:
      type: object
      properties:
        configured:
          type: boolean
        linked:
          type: boolean
          description: True when the Garmin key belongs to this profile
        running:
          type: boolean
        lastSyncAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        lastResult:
          type: object
          nullable: true
          properties:
            days:
              type: integer
            activities:
              type: integer
            from:
              type: string
            to:
              type: string
      required: [configured, linked, running]

    GarminActivityBrief:
      type: object
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        distanceMeters:
          type: number
          nullable: true
        trainingLoad:
          type: number
          nullable: true

    Readiness:
      type: object
      properties:
        available:
          type: boolean
        date:
          type: string
        level:
          type: string
          enum: [ready, caution, easy]
        headline:
          type: string
        reasons:
          type: array
          items:
            type: string
        metrics:
          type: object
          properties:
            sleepSeconds:
              type: integer
              nullable: true
            sleepScore:
              type: integer
              nullable: true
            hrvLastNight:
              type: integer
              nullable: true
            hrvBaselineLow:
              type: integer
              nullable: true
            hrvBaselineHigh:
              type: integer
              nullable: true
            hrvStatus:
              type: string
              nullable: true
            restingHr:
              type: integer
              nullable: true
            restingHrAvg:
              type: integer
              nullable: true
            bodyBatteryHigh:
              type: integer
              nullable: true
        yesterdayActivities:
          type: array
          items:
            $ref: "#/components/schemas/GarminActivityBrief"
      required: [available]

    GarminActivity:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        startTimeLocal:
          type: string
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        distanceMeters:
          type: number
          nullable: true
        avgHr:
          type: integer
          nullable: true
        trainingLoad:
          type: number
          nullable: true
      required: [id, date, startTimeLocal]
